name: Issue labeler

# Labels each issue from its Conventional Commits title, with the shared
# workflow in willardcsoriano/.github (its script and tests live there).

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    uses: willardcsoriano/.github/.github/workflows/label-issues.yml@v1.1.0
