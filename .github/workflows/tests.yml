name: Tests

# Runs tests/ on every PR and on master: the keyd config and app.conf that
# setup.sh writes are checked against keyd's grammar and key list (keyd skips
# a line it can't parse instead of failing, and has no check command).
# Python's standard library only. A record, not a merge gate.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
